name: "Production CI — Typecheck & Build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Configure Node.js 22 Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Compile Production Bundle
        run: npm run build
